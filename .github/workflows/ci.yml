name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python3 -m py_compile grokbot2api.py responses_api.py api_common.py sand_inference.py
      - name: Test
        run: python3 -m unittest discover -s tests -v
